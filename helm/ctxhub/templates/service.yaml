apiVersion: v1
kind: Service
metadata:
  name: {{ include "ctxhub.fullname" . }}
  labels:
    {{- include "ctxhub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 7342
      protocol: TCP
      name: http
  selector:
    {{- include "ctxhub.selectorLabels" . | nindent 4 }}
