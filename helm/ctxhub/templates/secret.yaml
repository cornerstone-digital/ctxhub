apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ctxhub.fullname" . }}-auth
  labels:
    {{- include "ctxhub.labels" . | nindent 4 }}
type: Opaque
data:
  CTXHUB_TENANT_ID: {{ .Values.auth.tenantId | b64enc | quote }}
  CTXHUB_CLIENT_ID: {{ .Values.auth.clientId | b64enc | quote }}
  CTXHUB_CLIENT_SECRET: {{ .Values.auth.clientSecret | b64enc | quote }}
