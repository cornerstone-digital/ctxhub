apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ctxhub.fullname" . }}
  labels:
    {{- include "ctxhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ctxhub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ctxhub.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: ctxhub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7342
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            {{- if .Values.offline }}
            - name: CTXHUB_OFFLINE
              value: "true"
            {{- end }}
            - name: CTXHUB_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "ctxhub.fullname" . }}-auth
                  key: CTXHUB_TENANT_ID
            - name: CTXHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "ctxhub.fullname" . }}-auth
                  key: CTXHUB_CLIENT_ID
            - name: CTXHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ctxhub.fullname" . }}-auth
                  key: CTXHUB_CLIENT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ctxhub.fullname" . }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
