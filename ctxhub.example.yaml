version: 1
workspace:
  name: my-workspace
repositories:
  - name: app
    path: ./app
    include:
      - "README.md"
      - "docs/**/*.md"
      - "adr/**/*.md"
      - "docs/architecture/**/*.mmd"
      - "diagrams/**/*.mmd"
    exclude:
      - "node_modules/**"
      - ".git/**"
      - "dist/**"
memory:
  provider: mempalace
  path: .ctxhub/memory/mempalace
index:
  provider: lancedb
  path: .ctxhub/index/lancedb
  table: ctxhub_chunks
  incremental: true
  chunkSize: 1800
  # concurrency: 8   # optional -- how many files' read/hash/chunk/summarize step runs at once
                      # during indexing (the actual index write always stays sequential)
hooks:
  postPull: "npm --prefix ./app install"
  postIndex: "echo indexed workspace $CTXHUB_WORKSPACE"
privacy:
  redactPatterns:
    - "(api[_-]?key|token|secret|password)\\s*[:=]\\s*[^\\s]+"
    - "AKIA[0-9A-Z]{16}"
# Opt-in: off by default. See "LLM-backed features" in README.md.
llm:
  enabled: false
  # agent: claude   # optional -- auto-detects claude/codex/copilot/cursor on PATH if unset
  timeoutMs: 120000
